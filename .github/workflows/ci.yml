name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check kintsua tests
          uv run ruff format --check kintsua tests
      - name: Tests
        run: uv run pytest -q -m "not network" --timeout 600 --durations=10
      - name: Package builds and installs clean
        run: |
          uv build
          python3 -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/kintsua --version
          /tmp/clean/bin/python -c "import kintsua; kintsua.wrap_http; kintsua.wrap_mcp"

  watch-self-test:
    # The CLI gating a deploy: snapshot a local MCP server and diff it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - name: kintsua watch snapshot + diff against the fixture MCP server
        run: |
          uv run kintsua watch snapshot --server "uv run python tests/fixtures/watchers/mcp_server.py" --name fixture
          uv run kintsua watch diff --server "uv run python tests/fixtures/watchers/mcp_server.py" --name fixture --github-action
      - name: a breaking schema change must fail the gate (exit 1)
        run: |
          set +e
          uv run kintsua watch diff --server "uv run python tests/fixtures/watchers/mcp_server.py" --name fixture --env KINTSUA_MCP_VARIANT=v2 --github-action
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          uv run kintsua watch report --since 1d
