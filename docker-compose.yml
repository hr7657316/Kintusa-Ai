# Local stack: Postgres 16, the API, two workers. `docker compose up --build`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: kintsua
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://postgres:dev@db:5432/kintsua
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      ENV: ${ENV:-dev}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-kintsua}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      DATA_DIR: /data
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: .
    command: ["python", "-m", "kintsua.seed"]
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: .
    command: ["python", "-m", "kintsua.api"]
    environment: *env
    ports: ["8000:8000"]
    volumes: ["data:/data"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: ["python", "-m", "kintsua.worker"]
    environment: *env
    volumes: ["data:/data", "/var/run/docker.sock:/var/run/docker.sock"]
    deploy:
      replicas: 2
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata: {}
  data: {}
