# Fly.io: one web process and two worker processes sharing one image.
# fly launch --no-deploy && fly postgres create && fly postgres attach <pg> && fly secrets set ...
app = "kintsua"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  BASE_URL = "https://kintsua.fly.dev"
  DATA_DIR = "/data"
  LLM_PROVIDER = "anthropic"
  SANDBOX_BACKEND = "docker"

[processes]
  web = "python -m kintsua.api"
  worker = "python -m kintsua.worker"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.checks]
    [http_service.checks.health]
      path = "/healthz"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[mounts]
  source = "kintsua_data"
  destination = "/data"
  processes = ["web", "worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  processes = ["worker"]
