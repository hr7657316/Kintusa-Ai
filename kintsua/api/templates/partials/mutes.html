<div id="mutes">
  {% if dismissed %}<div class="notice notice-ok">{{ dismissed | length }} open impact(s) dismissed by the new rule.</div>{% endif %}
  <ul class="plain">
    {% for m in mutes %}
    <li><code>{{ m }}</code>
      <button class="link" hx-delete="/v1/repos/{{ repo.id }}/mute?pattern={{ m | urlencode }}" hx-target="#mutes" hx-swap="outerHTML">remove</button></li>
    {% else %}
    <li class="muted">No mute rules.</li>
    {% endfor %}
  </ul>
  <form class="row" hx-post="/v1/repos/{{ repo.id }}/mute" hx-target="#mutes" hx-swap="outerHTML">
    <input type="text" name="pattern" placeholder="stripe:/v1/legacy/*" required>
    <button class="button" type="submit">Mute</button>
  </form>
</div>
