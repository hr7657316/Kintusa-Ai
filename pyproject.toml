[project]
name = "kintsua"
version = "0.1.1"
description = "Self-maintaining integrations for AI agents: watch every external API and MCP tool your agent depends on, detect breaking changes upstream, and open a tested fix PR."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Himanshu Raj", email = "himanshuraj.tn@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "openapi", "agents", "breaking-changes", "drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
# The open-source core: `kintsua watch` CLI + the runtime SDK. Deliberately light.
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.22",
  "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "requests>=2.32",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
kintsua = "kintsua.cli.main:app"

[project.urls]
Homepage = "https://github.com/hr7657316/Kintusa-Ai"
Repository = "https://github.com/hr7657316/Kintusa-Ai"
Issues = "https://github.com/hr7657316/Kintusa-Ai/issues"
"HOL Guard listing" = "https://hol.org/guard/extensions/command.kintsua"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kintsua"]

[tool.hatch.build.targets.sdist]
include = ["kintsua", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "B904", "SIM117", "SIM102", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"  # live upstream checks run on demand: pytest -m network
asyncio_mode = "auto"
timeout = 300
markers = [
  "network: requires outbound network access",
  "slow: slow end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
