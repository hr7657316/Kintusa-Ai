[project]
name = "kintsua"
version = "0.1.0"
description = "Self-maintaining integrations for AI agents: watch every external API and MCP tool your agent depends on, detect breaking changes upstream, and open a tested fix PR."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Himanshu Raj", email = "himanshuraj.tn@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "openapi", "agents", "breaking-changes", "drift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
# The open-source core: `kintsua watch` CLI + the runtime SDK. Deliberately light.
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.22",
  "packaging>=24.0",
]

[project.optional-dependencies]
# The hosted product: API, workers, watchers, classifier, indexer, matcher, fixer.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.3",
  "PyGithub>=2.3",
  "anthropic>=0.40",
  "openai>=1.40",
  "trafilatura>=1.12",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
  "stripe>=10.0",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "docker>=7.1",
  "boto3>=1.34",
  "feedgen>=1.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
kintsua = "kintsua.cli.main:app"

[project.urls]
Homepage = "https://github.com/hr7657316/Kintusa-Ai"
Repository = "https://github.com/hr7657316/Kintusa-Ai"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kintsua"]

[tool.hatch.build.targets.sdist]
include = ["kintsua", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "B904", "SIM117", "SIM102", "B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"  # live upstream checks run on demand: pytest -m network
asyncio_mode = "auto"
timeout = 300
markers = [
  "db: requires a local Postgres (DATABASE_URL)",
  "network: requires outbound network access",
  "llm: requires an LLM API key",
  "slow: slow end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
