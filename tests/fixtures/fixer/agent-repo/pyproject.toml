[project]
name = "weather-billing-agent"
version = "0.1.0"
description = "Fixture repo for the Kintsua fixer: a tiny agent that charges cards with Stripe and asks an MCP weather tool for forecasts."
requires-python = ">=3.12"
dependencies = ["stripe>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
