<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kintsua{% endblock %}</title>
  <meta name="description" content="{% block description %}Self-maintaining integrations for AI agents: Kintsua watches every external API and MCP tool your agent depends on, detects breaking changes upstream and opens a tested fix PR.{% endblock %}">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="alternate" type="application/rss+xml" title="Kintsua weekly drift report" href="/report/weekly?format=rss">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Kintsua</a>
  <nav>
    <a href="/report/weekly">Weekly report</a>
    {% if user %}
    <a href="/settings">Settings</a>
    <form method="post" action="/logout" class="inline"><button class="link" type="submit">Sign out ({{ user.login }})</button></form>
    {% else %}
    <a href="/login">Sign in with GitHub</a>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <span>Kintsua · self-maintaining integrations for AI agents</span>
  <span><a href="/report/weekly">weekly drift report</a> · <a href="/report/weekly?format=rss">RSS</a> · <a href="https://github.com/hr7657316/Kintusa-Ai">source</a></span>
</footer>
</body>
</html>
